name: Build ZenClient JAR
 
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
 
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'
 
      - name: Build JAR
        run: gradle build
 
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZenClient-1.21.1-JAR
          path: build/libs/zenclient-*.jar
          if-no-files-found: error
          retention-days: 30
